license = "MIT"
issueTrackerURL = "https://github.com/dns54/ChickensShed/issues"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "dns54"
description = "Chickens shed their feathers occasionally."
${icon_key} = "assets/chickensshed/icon.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/chickensshed"

[[mixins]]
config = "chickensshed.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
