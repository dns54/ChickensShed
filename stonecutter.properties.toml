# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "chickensshed"
mod.name = "ChickensShed"
mod.group = "io.github.dns54"
mod.version = "2.0.0"

deps.fabric_loader = "0.19.5"
loomx.loom_version = "1.18-SNAPSHOT"

["1.20.1"]
# List of releases to be marked compatible on Modrinth/Curseforge
# Not 1.20: the Forge side needs Forge 47, which is 1.20.1 only
mod.mc_releases = ["1.20.1"]


[fabric."1.20.1"]
# Mod compatibility range in fabric.mod.json/neoforge.mods.toml
mod.mc_compat = ">=1.20 <=1.20.1"
deps.modmenu = "7.2.2"
# Dev runs only (Mod Menu needs it), never a dependency of the mod
deps.fabric_api = "0.92.12+1.20.1"
# Modrinth version ids (version numbers are shared between loaders)
deps.supplementaries = "hsHs7Gle"
# By version number: by id, Modrinth maven serves this version's sources jar (marked primary)
deps.moonlight = "1.20-2.16.37-fabric"


[forge."1.20.1"]
mod.mc_compat = "[1.20.1]"
deps.forge = "1.20.1-47.4.28"
deps.supplementaries = "foXRPXFH"
deps.moonlight = "xnpMngM4"


["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]


[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
deps.modmenu = "11.0.5"
# Dev runs only (Mod Menu needs it), never a dependency of the mod
deps.fabric_api = "0.116.17+1.21.1"
deps.supplementaries = "q5DOgja6"
deps.moonlight = "fWlk6YEB"


[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.1]"
deps.neo_loader = "21.1.251"
deps.supplementaries = "p6ACSdhd"
deps.moonlight = "fAIfWX6M"


["1.21.11"]
mod.mc_releases = ["1.21.11"]


[fabric."1.21.11"]
mod.mc_compat = "1.21.11"
deps.modmenu = "17.0.1"
# Dev runs only (Mod Menu needs it), never a dependency of the mod
deps.fabric_api = "0.141.6+1.21.11"

[neoforge."1.21.11"]
mod.mc_compat = "[1.21.11]"
deps.neo_loader = "21.11.45"


["26.3"]
mod.mc_releases = ["26.3"]


[fabric."26.3"]
mod.mc_compat = "~26.3"
deps.modmenu = "21.0.0"
# Dev runs only (Mod Menu needs it), never a dependency of the mod
deps.fabric_api = "0.163.0+26.3"


[neoforge."26.3"]
mod.mc_compat = "[26.3, 26.4)"
deps.neo_loader = "26.3.0.13-beta"
